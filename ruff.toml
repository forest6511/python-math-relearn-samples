# 本書（Pythonで学び直す中学・高校数学）の紙面に合わせた設定。
# line-length は PB のコード欄に1行で入る桁数から決めた（8pt で英数字58桁まで入る → 57。
# 全角は2桁と数える）。本のコードはこの repo からそのまま差し込むので、ここで形を揃える。
line-length = 57
target-version = "py310"

[lint]
select = ["E", "W", "F", "B", "UP", "I"]
# B007（使っていないループ変数）: 本では「6回くり返す」を for i in range(6) と書いて見せている。
# 初心者向けの写経用コードなので、_ に変えずに残す。
ignore = ["B007"]
